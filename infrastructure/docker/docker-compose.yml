
services:
  pos-db:
    image: postgres:16
    container_name: mercandes-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POS_DB_NAME}
      POSTGRES_USER: ${POS_DB_USER}
      POSTGRES_PASSWORD: ${POS_DB_PASSWORD}
    ports:
      - "${POS_DB_PORT}:5432"
    volumes:
      - pos_data:/var/lib/postgresql/data
      - ../../database/schemas/pos/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  pos_data:
