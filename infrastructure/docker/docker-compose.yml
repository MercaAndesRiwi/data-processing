
services:
  pos-db:
    image: postgres:16
    container_name: mercandes-pos-db
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "${POS_DB_PORT:-5432}:5432"
    volumes:
      - pos_data:/var/lib/postgresql/data
      - ../../database/schemas/pos/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./entrypoint-sync.sh:/usr/local/bin/entrypoint-sync.sh:ro
    entrypoint: ["bash", "/usr/local/bin/entrypoint-sync.sh", "postgres"]

volumes:
  pos_data:
