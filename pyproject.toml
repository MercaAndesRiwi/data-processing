[project]
name = "data-processing"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "ipykernel",
    "jupyterlab",
    "kagglehub",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "requests",
    "seaborn",
    "sqlalchemy",
    "psycopg[binary]",
    "python-dotenv>=1.2.4",
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]
 
[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
