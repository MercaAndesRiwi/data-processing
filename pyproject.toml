[project]
name = "data-processing"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "ipykernel",
    "jupyterlab",
    "kagglehub",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "requests",
    "seaborn",
    "sqlalchemy",
    "psycopg[binary]",
    "python-dotenv>=1.2.4",
]
 
[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
